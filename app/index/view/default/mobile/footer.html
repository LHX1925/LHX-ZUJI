<script>
var appToastTimer = null;
function appToast(msg, type) {
    type = type || 'info';
    var t = document.getElementById('appToast');
    clearTimeout(appToastTimer);
    t.className = 'app-toast app-toast-' + type + ' show';
    t.textContent = msg;
    appToastTimer = setTimeout(function(){ t.className = 'app-toast'; }, 2500);
}
</script>
