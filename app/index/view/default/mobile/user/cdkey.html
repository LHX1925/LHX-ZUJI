<script>
(function checkJQ(){
    if (typeof window.jQuery !== 'undefined') {
        $(function(){
            var redeeming = false;
            $('#cdkey-input').on('keydown', function(e) { if (e.key === 'Enter') doRedeem(); });
            $('#btn-redeem').on('click', function() { doRedeem(); });
            function doRedeem() {
                if (redeeming) return;
                var cdkey = $.trim($('#cdkey-input').val());
                if (!cdkey) { showToast('请输入卡密', 'warning'); $('#cdkey-input').focus(); return; }
                redeeming = true;
                var btn = $('#btn-redeem');
                btn.prop('disabled', true).text('兑换中...');
                $.ajax({
                    type: 'POST', url: '', data: { cdkey: cdkey }, dataType: 'json',
                    success: function(data) {
                        redeeming = false;
                        btn.prop('disabled', false).text('兑 换');
                        if (data.code == 1) {
                            showToast(data.msg || '兑换成功！', 'success', 3000);
                            $('#cdkey-input').val('');
                            setTimeout(function() { if (data.reload) window.location.reload(); }, 1500);
                        } else if (data.code == -2) {
                            handleRealnameResponse(data);
                        } else {
                            showToast(data.msg || '兑换失败，请检查卡密是否正确', 'danger', 3000);
                        }
                    },
                    error: function() { redeeming = false; btn.prop('disabled', false).text('兑 换'); showToast('网络错误，请稍后重试', 'danger'); }
                });
            }
            $('#cdkey-input').focus();
        });
    } else { setTimeout(checkJQ, 50); }
})();
</script>
