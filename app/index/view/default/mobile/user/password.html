{php}$title = '修改密码'; $tab_active = 'profile';{/php}
{include file="default/mobile/header" /}
<div class="app-card" style="margin-bottom:12px;text-align:center;padding:20px 16px;">
    <h2 style="font-size:18px;font-weight:700;color:var(--glass-text);margin:0 0 4px;">修改密码</h2>
    <p style="font-size:13px;color:var(--glass-text-secondary);margin:0;">选择验证方式修改密码</p>
</div>
<div class="app-categories" style="margin-bottom:12px;">
    <div class="app-category-chip active" data-tab="jmmyz" onclick="switchTab('jmmyz')">旧密码验证</div>
    <div class="app-category-chip" data-tab="yxyz" onclick="switchTab('yxyz')">邮箱验证</div>
</div>
<!-- 旧密码验证 -->
<div class="tab-panel active" id="panel-jmmyz">
    <div class="app-card" style="padding:20px 16px;">
        <form id="form1">
            <div style="margin-bottom:14px;">
                <label style="display:block;font-size:14px;font-weight:600;color:var(--glass-text);margin-bottom:6px;">旧密码</label>
                <input type="password" name="userPwd" class="app-input" placeholder="请输入旧密码" autocomplete="off">
            </div>
            <div style="margin-bottom:14px;">
                <label style="display:block;font-size:14px;font-weight:600;color:var(--glass-text);margin-bottom:6px;">新密码</label>
                <input type="password" name="newUserPwd" class="app-input" placeholder="请输入新密码" autocomplete="off">
            </div>
            <div style="margin-bottom:14px;">
                <label style="display:block;font-size:14px;font-weight:600;color:var(--glass-text);margin-bottom:6px;">确认新密码</label>
                <input type="password" name="newUserRepwd" class="app-input" placeholder="再次输入新密码" autocomplete="off">
            </div>
            <button type="submit" class="app-btn" style="width:100%;">修改密码</button>
        </form>
    </div>
</div>
<!-- 邮箱验证 -->
<div class="tab-panel" id="panel-yxyz" style="display:none;">
    <div class="app-card" style="padding:20px 16px;">
        <form id="form2">
            <div style="margin-bottom:14px;">
                <label style="display:block;font-size:14px;font-weight:600;color:var(--glass-text);margin-bottom:6px;">邮箱</label>
                <input type="text" class="app-input" value="{$user.mail|default='未绑定'}" readonly style="background:var(--glass-bg-light);color:var(--glass-text-muted);">
            </div>
            <div style="margin-bottom:14px;">
                <button type="button" id="slide-captcha-btn" style="width:100%;height:44px;border:1.5px dashed var(--glass-primary);border-radius:10px;background:var(--glass-bg-light);color:var(--glass-primary);font-size:14px;cursor:pointer;font-weight:500;">点击进行滑块验证</button>
                <input type="hidden" name="captcha" id="captcha-verified" value="">
            </div>
            <div style="display:flex;gap:10px;margin-bottom:14px;">
                <input type="text" class="app-input" name="code" placeholder="请输入邮箱验证码" required style="flex:1;">
                <button type="button" class="app-btn" id="sendCode" style="flex-shrink:0;padding:10px 16px;font-size:13px;background:transparent;color:var(--glass-primary);border:1.5px solid var(--glass-primary);">获取验证码</button>
            </div>
            <div style="margin-bottom:14px;">
                <label style="display:block;font-size:14px;font-weight:600;color:var(--glass-text);margin-bottom:6px;">新密码</label>
                <input type="password" name="newpass" class="app-input" placeholder="请输入新的密码">
            </div>
            <button type="submit" class="app-btn" style="width:100%;">修改密码</button>
        </form>
    </div>
</div>
{include file="index@default/captcha_assets" /}
<script>
$(function() {
    var captchaVerified = false;
    if (typeof window.slideCaptcha !== 'function') {
        $('#slide-captcha-btn').html('验证组件加载失败，请刷新').css({'border-color':'#f44336','background':'#FFEBEE','color':'#f44336'});
    }
    $('#slide-captcha-btn').on('click', function() {
        if (typeof window.slideCaptcha !== 'function') return;
        window.slideCaptcha({
            onSuccess: function(token) {
                captchaVerified = true;
                $('#captcha-verified').val(token);
                $('#slide-captcha-btn').css({'border-color':'#4caf50','background':'#E8F5E9','color':'#4caf50'}).html('验证通过');
            },
            onError: function() {
                captchaVerified = false;
                $('#captcha-verified').val('');
                $('#slide-captcha-btn').css({'border-color':'#f44336','background':'#FFEBEE','color':'#f44336'}).html('验证失败，点击重试');
            },
            onClose: function() {
                if (!captchaVerified) {
                    $('#slide-captcha-btn').css({'border-color':'var(--glass-primary)','background':'var(--glass-bg-light)','color':'var(--glass-primary)'}).html('点击进行滑块验证');
                }
            }
        });
    });
    function resetCaptcha() {
        captchaVerified = false;
        $('#captcha-verified').val('');
        $('#slide-captcha-btn').css({'border-color':'var(--glass-primary)','background':'var(--glass-bg-light)','color':'var(--glass-primary)'}).html('点击进行滑块验证');
    }
    $('#sendCode').on('click', function() {
        if (!captchaVerified) { appToast('请先完成滑块验证', 'warning'); return; }
        var btn = this;
        btn.disabled = true;
        btn.textContent = '发送中...';
        $.post('', { act: 'validate', captcha: $('#captcha-verified').val() }, function(res) {
            if (res.code == 1) {
                appToast(res.msg, 'success');
                var count = 60;
                var timer = setInterval(function() {
                    btn.textContent = count + '秒后重发';
                    count--;
                    if (count < 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; }
                }, 1000);
            } else {
                appToast(res.msg, 'error');
                btn.disabled = false;
                btn.textContent = '获取验证码';
                resetCaptcha();
            }
        }, 'json');
    });
    $('#form1').on('submit', function(e) {
        e.preventDefault();
        var userPwd = $('input[name="userPwd"]').val();
        var newUserPwd = $('input[name="newUserPwd"]').val();
        var newUserRepwd = $('input[name="newUserRepwd"]').val();
        if (!userPwd || !newUserPwd || !newUserRepwd) { appToast('不可为空', 'warning'); return; }
        var btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = '处理中...';
        $.post('', { act: 'jmmxg', userPwd: userPwd, newUserPwd: newUserPwd, newUserRepwd: newUserRepwd }, function(res) {
            if (res.code == 1) { appToast(res.msg, 'success'); }
            else { appToast(res.msg, 'error'); }
            btn.disabled = false;
            btn.textContent = '修改密码';
        }, 'json');
    });
    $('#form2').on('submit', function(e) {
        e.preventDefault();
        var newpass = $('input[name="newpass"]').val();
        var code = $('input[name="code"]').val();
        if (!newpass || !code) { appToast('必填项不可为空', 'warning'); return; }
        var btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = '处理中...';
        $.post('', { act: 'yxmmxg', code: code, newpass: newpass }, function(res) {
            if (res.code == 1) { appToast(res.msg || '操作成功', 'success'); setTimeout(function() { location.href = ''; }, 1800); }
            else { appToast(res.msg, 'error'); }
            btn.disabled = false;
            btn.textContent = '修改密码';
        }, 'json');
    });
});
function switchTab(tab) {
    document.querySelectorAll('.app-category-chip').forEach(function(el) { el.classList.remove('active'); });
    document.querySelector('.app-category-chip[data-tab="' + tab + '"]').classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(function(el) { el.style.display = 'none'; });
    document.getElementById('panel-' + tab).style.display = 'block';
}
</script>
{include file="default/mobile/footer" /}
