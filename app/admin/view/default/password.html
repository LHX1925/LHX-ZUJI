{include file="default/header" title="修改密码"/}
<!--页面主要内容-->
<main class="lyear-layout-content">
  <div class="container-fluid glass-animate-in">

    <div class="row">
      <div class="col-lg-8">
        <div class="card admin-card">
          <header class="card-header">
            <div class="card-title">
              <i class="mdi mdi-lock-outline"></i> 修改密码
            </div>
          </header>
          <div class="card-body">

            <div class="admin-password-hint">
              <i class="mdi mdi-shield-check-outline"></i>
              <div>
                <strong>安全提示</strong>
                <p>请使用至少6位以上的密码，包含字母和数字组合，避免使用简单密码。</p>
              </div>
            </div>

            <form method="POST" action="" class="site-form admin-form" autocomplete="off">
              <div class="mb-4">
                <label for="oldpassword" class="form-label">
                  <i class="mdi mdi-key-outline"></i> 当前密码
                </label>
                <div class="input-group">
                  <input type="password" class="form-control" name="oldpassword" id="oldpassword" placeholder="请输入当前密码" required autocomplete="current-password">
                  <button type="button" class="btn btn-outline-secondary toggle-password" data-target="oldpassword">
                    <i class="mdi mdi-eye-outline"></i>
                  </button>
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">
                  <i class="mdi mdi-lock-reset"></i> 新密码
                </label>
                <div class="input-group">
                  <input type="password" class="form-control" name="password" id="password" placeholder="请输入新密码（至少6位）" required autocomplete="new-password" minlength="6">
                  <button type="button" class="btn btn-outline-secondary toggle-password" data-target="password">
                    <i class="mdi mdi-eye-outline"></i>
                  </button>
                </div>
                <small class="form-text text-muted">密码长度至少6位，建议包含字母和数字</small>
              </div>

              <div class="mb-4">
                <label for="newpassword" class="form-label">
                  <i class="mdi mdi-lock-check-outline"></i> 确认新密码
                </label>
                <div class="input-group">
                  <input type="password" class="form-control" name="newpassword" id="newpassword" placeholder="请再次输入新密码" required autocomplete="new-password" minlength="6">
                  <button type="button" class="btn btn-outline-secondary toggle-password" data-target="newpassword">
                    <i class="mdi mdi-eye-outline"></i>
                  </button>
                </div>
              </div>

              <div class="form-actions">
                <button type="submit" class="btn-admin btn-admin-primary">
                  <i class="mdi mdi-content-save-outline"></i> 更新密码
                </button>
              </div>
            </form>

          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card admin-card">
          <header class="card-header">
            <div class="card-title">
              <i class="mdi mdi-information-outline"></i> 密码要求
            </div>
          </header>
          <div class="card-body">
            <ul class="password-rules">
              <li><i class="mdi mdi-check-circle-outline"></i> 密码长度至少6位</li>
              <li><i class="mdi mdi-check-circle-outline"></i> 建议包含大小写字母</li>
              <li><i class="mdi mdi-check-circle-outline"></i> 建议包含数字</li>
              <li><i class="mdi mdi-alert-circle-outline"></i> 不要使用简单密码</li>
              <li><i class="mdi mdi-alert-circle-outline"></i> 修改后需重新登录</li>
            </ul>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>
<!--End 页面主要内容-->

<style>
/* Password page styles */
.admin-password-hint {
  display: flex;
  gap: 14px;
  padding: 14px 18px;
  margin-bottom: 24px;
  background: rgba(79, 124, 255, 0.08);
  border: 1px solid rgba(79, 124, 255, 0.15);
  border-radius: var(--glass-radius);
  align-items: flex-start;
}
.admin-password-hint > i {
  font-size: 28px;
  color: var(--glass-primary);
  flex-shrink: 0;
  margin-top: 2px;
}
.admin-password-hint strong {
  display: block;
  font-size: 14px;
  color: var(--glass-text);
  margin-bottom: 4px;
}
.admin-password-hint p {
  margin: 0;
  font-size: 12.5px;
  color: var(--glass-text-secondary);
}
.input-group .btn {
  border-color: var(--glass-border);
  background: var(--glass-bg-light);
  color: var(--glass-text-secondary);
}
.input-group .btn:hover {
  background: var(--glass-bg);
  color: var(--glass-text);
}
.input-group .form-control {
  border-right: none;
}
.input-group .form-control:focus {
  border-color: var(--glass-primary);
}
.input-group .form-control:focus + .btn {
  border-color: var(--glass-primary);
}
.password-rules {
  list-style: none;
  padding: 0;
  margin: 0;
}
.password-rules li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--glass-border);
  font-size: 13px;
  color: var(--glass-text-secondary);
}
.password-rules li:last-child {
  border-bottom: none;
}
.password-rules li i {
  font-size: 20px;
  color: var(--glass-text-muted);
  flex-shrink: 0;
}
.password-rules li i.mdi-check-circle-outline {
  color: #10b981;
}
.password-rules li i.mdi-alert-circle-outline {
  color: #f59e0b;
}
.form-actions {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--glass-border);
}
</style>

{include file="default/footer" /}
<script>
    // 密码显示/隐藏切换
    $('.toggle-password').on('click', function(){
        var targetId = $(this).data('target');
        var input = $('#' + targetId);
        var icon = $(this).find('i');
        if(input.attr('type') === 'password'){
            input.attr('type', 'text');
            icon.removeClass('mdi-eye-outline').addClass('mdi-eye-off-outline');
        } else {
            input.attr('type', 'password');
            icon.removeClass('mdi-eye-off-outline').addClass('mdi-eye-outline');
        }
    });

    $("form").submit(function (){
        var load = layer.msg('修改中，请稍后...', {icon:16, shade:0.8, time:false});

        var oldpassword = $("input[name='oldpassword']").val().trim();
        var password = $("input[name='password']").val().trim();
        var newpassword = $("input[name='newpassword']").val().trim();

        if(oldpassword === '' || password === '' || newpassword === ''){
            layer.close(load);
            layer.alert('请填写所有密码字段',{icon:2,shade:0.8});
            return false;
        }

        if(password.length < 6){
            layer.close(load);
            layer.alert('新密码长度至少6位',{icon:2,shade:0.8});
            return false;
        }

        if(password !== newpassword){
            layer.close(load);
            layer.alert('两次输入的新密码不一致',{icon:2,shade:0.8});
            return false;
        }

        $.ajax({
            type:'POST',
            url:'',
            data:{
                oldpassword:oldpassword,
                password:password,
                newpassword:newpassword,
            },
            dataType:'json',
            success:function (data){
                layer.close(load);
                if(data.code == 1){
                    layer.alert(data.msg,{icon:1,shade:0.8},function(){
                        location.reload();
                    });
                }else{
                    layer.alert(data.msg,{icon:2,shade:0.8});
                }
            }
        });
        return false;
    });
</script>
