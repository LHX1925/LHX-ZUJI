{include file="default/header" title="服务器列表"/}
<main class="lyear-layout-content page-wrap">
  <div class="page-header-bar">
    <h3 class="page-header-bar-title">服务器列表</h3>
    <form method="get" action="" class="search-box">
      <input class="form-input search-box-input" type="text" name="search" placeholder="搜索服务器名称..." value=""/>
      <button class="new-btn primary search-box-btn">
        <span class="mdi mdi-magnify"></span> 搜索
      </button>
    </form>
  </div>
  <div class="content-card">
    <div class="content-card-header">
      <span>服务器管理</span>
    </div>
    <div class="content-card-body">
      <div class="mb-3">
        <button onclick='add()' class="new-btn primary me-1"><span class="mdi mdi-plus" aria-hidden="true"></span> 添加服务器</button>
        <button onclick='del()' class="new-btn danger">
          <span class="mdi mdi-window-close" aria-hidden="true"></span> 删除选中
        </button>
        <button onclick='qbdel()' class="new-btn danger">
          <span class="mdi mdi-window-close" aria-hidden="true"></span> 全部删除
        </button>
      </div>
      <div class="table-responsive-sm">
        <table class="new-table">
          <thead>
            <tr>
              <th>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="check-all" title="全选/取消全选">
                  <label class="form-check-label" for="check-all" title="全选/取消全选"></label>
                </div>
              </th>
              <th>ID</th>
              <th>名称</th>
              <th>服务器插件</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            {foreach $server as $s}
            <tr>
              <td data-label="选择">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input ids" name="ids" id="srv-{$s.id}" value="{$s.id}">
                  <label class="form-check-label" for="srv-{$s.id}"></label>
                </div>
              </td>
              <td data-label="ID">{$s.id}</td>
              <td data-label="名称">{$s.name}</td>
              <td data-label="服务器插件">{$s.serverplugins}</td>
              <td data-label="操作">
                <a href="/admin/server/{$s.id}" class="new-btn success"><i class="mdi mdi-pencil"></i> 编辑</a>
              </td>
            </tr>
            {/foreach}
          </tbody>
        </table>
      </div>
      <div style="text-align:center;margin-top:16px">{$server->render()}</div>
    </div>
  </div>
</main>
{include file="default/footer" /}

function add1(){
             var load = layer.msg('添加中，请稍后...', {icon:16, shade:0.8, time:false});
 var form = $('#myform').serializeArray();
       $.ajax({
            type:'POST',
            url:'',
data:form,
            dataType:'json',
            timeout: 15000,
            success:function (data){
                layer.close(load)
                if(data.code == 1){
                    setTimeout(function (){
                        location.href = ''
                    },1000);
                    layer.alert(data.msg,{icon:1});
                }else{
                    GlassTip.error(data.msg);
                }
            }
        });
    }




function del(){
var id = [];
$("input[name='ids']:checked").each(function(i){
        id[i] =$(this).val();
      });
var id = id.join(",");
if(id==""){
layer.alert("请先勾选要删除的服务器（点击表格最左侧的方框；表头方框可全选当前页）",{icon:2,shade:0.8,title:"未选择服务器"});
}else{
        layer.confirm('确定要删除ID为<span style="color:#0b5ed7">'+ id +'</span>的服务器吗？', {icon:3, title:'删除确认'}, function (){
            del1(id)
        });
    }
}

    function del1(id, force){
        var load = layer.load('1',{time:false});

        $.ajax({
            type:'POST',
            url:'',
            data:{
                act:'delete',
                cid:id,
                force: force ? 1 : 0
            },
            dataType:'json',
            success:function (data){
                layer.close(load);
                if(data.code == 1){
                    if(parseInt(data.fail||0) > 0){
                        var blocked = data.blocked || [];
                        if(blocked.length){
                            var blockedIds = blocked.map(function(b){ return b.id; }).join(',');
                            layer.confirm(
                                data.msg
                                + '<br><br>是否强制删除这 ' + blocked.length + ' 台被产品引用的服务器？'
                                + '<br><span style="color:#b45309">强制删除会把这些产品的「默认服务器」清空（产品本身保留，用户购买时可自由改选其它线路）。</span>',
                                {icon:3, title:'部分服务器被产品引用', shade:0.8},
                                function(){ del1(blockedIds, 1); }
                            );
                        }else{
                            layer.alert(data.msg,{icon:0,title:'删除结果',shade:0.8},function(){
                                if(parseInt(data.ok||0) > 0){ window.location.href = ""; }
                                else { layer.closeAll(); }
                            });
                        }
                    }else{
                        layer.alert(data.msg,{icon:1,title:'删除结果'},function(){
                            window.location.href = "";
                        });
                    }
                }else{
                    layer.alert(data.msg || '删除失败',{icon:2,title:'删除失败',shade:0.8});
                }
            },
            error:function(xhr){
                layer.close(load);
                layer.alert('请求失败（HTTP ' + (xhr && xhr.status ? xhr.status : '?') + '），请刷新页面后重试',{icon:2,title:'删除失败'});
            }
        });
    }

// ===== 全选 / 单选联动 =====
function syncCheckAllState(){
    var $rows = $("input[name='ids']");
    var total = $rows.length;
    var checked = $rows.filter(':checked').length;
    $('#check-all')
        .prop('checked', total > 0 && checked === total)
        .prop('indeterminate', checked > 0 && checked < total);
    $rows.each(function(){
        $(this).closest('tr').toggleClass('row-selected', this.checked);
    });
}

$(function(){
    // 表头全选：勾上/取消当前页全部
    $('#check-all').on('change', function(){
        $("input[name='ids']").prop('checked', this.checked);
        syncCheckAllState();
    });
    // 单行勾选变化时同步表头状态
    $(document).on('change', "input[name='ids']", syncCheckAllState);
    syncCheckAllState();
});
</script>
