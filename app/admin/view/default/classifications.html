{include file="default/header" title="分类信息"/}
<style>
.lyear-layout-content.page-wrap{position:relative!important;height:auto!important;width:100%!important;max-width:1280px!important;margin:0 auto!important;left:auto!important;padding:calc(64px + 24px) 20px 40px 20px!important}
.page-wrap { --pri: #667eea; --pri2: #764ba2; --radius: 16px; }
.page-header-bar {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: 16px; padding: 20px 24px; margin-bottom: 20px;
  color: #fff; box-shadow: 0 4px 20px rgba(102,126,234,0.25);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
.page-header-bar h2 { margin: 0; font-size: 20px; font-weight: 700; }
.page-header-bar .sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }
.content-card {
  background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.05);
  border: 1px solid #e8ecf1; overflow: hidden; margin-bottom: 20px;
}
.content-card-header {
  padding: 14px 20px; border-bottom: 1px solid #f1f5f9;
  font-weight: 700; color: #1a1a2e; font-size: 14px;
  display: flex; align-items: center; gap: 8px;
}
.content-card-header::before {
  content: ''; width: 4px; height: 18px; border-radius: 2px;
  background: linear-gradient(180deg, #667eea, #764ba2);
}
.content-card-body { padding: 18px 20px; }
.new-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 16px; border-radius: 10px; border: none;
  font-size: 12px; font-weight: 600; cursor: pointer;
  transition: all 0.2s; text-decoration: none;
}
.new-btn.primary { background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; box-shadow: 0 3px 10px rgba(102,126,234,0.3); }
.new-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(102,126,234,0.4); }
.form-input { width: 100%; padding: 9px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 13px; transition: all 0.2s; background: #fff; color: #334155; }
.form-input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); outline: none; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 5px; }
.form-select { width: 100%; padding: 9px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 13px; background: #fff; color: #334155; }
.form-select:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); outline: none; }
.mb-3 { margin-bottom: 16px; }
@media (max-width: 768px) {
  .page-header-bar { padding: 14px 16px; border-radius: 12px; }
  .page-header-bar h2 { font-size: 17px; }
  .content-card-body { padding: 12px 14px; }
}
</style>
<main class="lyear-layout-content page-wrap">
  <div class="container-fluid">
    <div class="page-header-bar">
      <div>
        <h2>分类信息</h2>
        <div class="sub">编辑分类详情</div>
      </div>
    </div>

    <div class="content-card">
      <div class="content-card-header">基本信息</div>
      <div class="content-card-body">
        <form action="" method="post" class="edit-form">
          <div class="mb-3">
            <label class="form-label">标题</label>
            <input class="form-input" type="text" name="name" value="{$product.name}" placeholder="">
          </div>

          <div class="mb-3">
            <label class="form-label">介绍</label>
            <textarea style="height:200px" class="form-input" name="introduce">{$product.introduce}</textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">排序</label>
            <input class="form-input" type="text" name="sort" value="{$product.sort}" placeholder="数值越大越靠前">
          </div>

          <div class="mb-3">
            <label class="form-label">是否隐藏</label>
            <select name="hide" class="form-select">
              <option value="0" {if $product.hide=="0"}selected{/if}>否</option>
              <option value="1" {if $product.hide=="1"}selected{/if}>是</option>
            </select>
          </div>

          <button type="submit" class="new-btn primary">修改</button>
        </form>
      </div>
    </div>
  </div>
</main>

{include file="default/footer" /}
<script>
    $("form").submit(function (){
        var load = layer.msg('修改中，请稍后...', {icon:16, shade:0.8, time:false});

        var name = $("input[name='name']").val();
        var introduce = $("textarea[name='introduce']").val();
        var hide = $("select[name='hide']").val();
        var sort = $("input[name='sort']").val();

           $.ajax({
            type:'POST',
            url:'',
            data:{
                name:name,
                introduce:introduce,
                hide:hide,
                sort:sort,
            },
            dataType:'json',
            success:function (data){
                layer.close(load);
                if(data.code == 1){
                    layer.alert(data.msg,{icon:1,shade:0.8});
                }else{
                    layer.alert(data.msg,{icon:2,shade:0.8});
                }
            }
        });
        return false;
    });
</script>
