{include file="default/header" title="产品分类"/}
<main class="lyear-layout-content page-wrap">
  <div class="page-header-bar">
    <h3 class="page-header-bar-title">产品分类</h3>
    <form method="get" action="" class="search-box">
      <input class="form-input search-box-input" type="text" name="search" placeholder="搜索分类名称..." value=""/>
      <button class="new-btn primary search-box-btn">
        <span class="mdi mdi-magnify"></span> 搜索
      </button>
    </form>
  </div>
  <div class="content-card">
    <div class="content-card-header">
      <span>分类列表</span>
    </div>
    <div class="content-card-body">
      <div class="mb-3">
        <button onclick='add()' class="new-btn primary me-1"><span class="mdi mdi-plus" aria-hidden="true"></span> 添加分类</button>
        <button onclick='del()' class="new-btn danger">
          <span class="mdi mdi-window-close" aria-hidden="true"></span> 删除选中
        </button>
        <button onclick='qbdel()' class="new-btn danger">
          <span class="mdi mdi-window-close" aria-hidden="true"></span> 全部删除
        </button>
      </div>
      <div class="table-responsive-sm">
        <table class="new-table">
          <thead>
            <tr>
              <th>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="check-all">
                  <label class="form-check-label" for="check-all"></label>
                </div>
              </th>
              <th>ID</th>
              <th>排序</th>
              <th>标题</th>
              <th>是否隐藏</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            {foreach $product as $p}
            <tr>
              <td data-label="选择">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input ids" name="ids" value="{$p.id}">
                  <label class="form-check-label" for="ids-1"></label>
                </div>
              </td>
              <td data-label="ID">{$p.id}</td>
              <td data-label="排序">{$p.sort}</td>
              <td data-label="标题">{$p.name}</td>
              <td data-label="是否隐藏">{if $p.hide=="1"}<span class="new-badge danger">是</span>{else}<span class="new-badge success">否</span>{/if}</td>
              <td data-label="操作">
                <a href="/admin/classification/{$p.id}" class="new-btn success"><i class="mdi mdi-pencil"></i> 编辑信息</a>
              </td>
            </tr>
            {/foreach}
          </tbody>
        </table>
      </div>
      <div style="text-align:center;margin-top:16px">{$product->render()}</div>
    </div>
  </div>
</main>
{include file="default/footer" /}
<style>
.lyear-layout-content.page-wrap{position:relative!important;height:auto!important;width:100%!important;max-width:1280px!important;margin:0 auto!important;left:auto!important;padding:calc(64px + 24px) 20px 40px 20px!important}
.page-header-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;background:linear-gradient(135deg,#667eea,#764ba2);padding:22px 28px;border-radius:16px;margin-top:16px;box-shadow:0 6px 24px rgba(102,126,234,.25)}
.page-header-bar-title{color:#fff;font-size:1.35rem;font-weight:700;margin:0;letter-spacing:.3px}
.search-box{display:flex;align-items:center;gap:0}
.search-box-input{border-radius:10px 0 0 10px !important;border-right:none !important;min-width:220px}
.search-box-btn{border-radius:0 10px 10px 0 !important;white-space:nowrap}
.form-input{display:block;width:100%;padding:9px 14px;font-size:14px;line-height:1.5;color:#333;background-color:#fff;background-clip:padding-box;border:1.5px solid #d5dae2;border-radius:10px;transition:border-color .2s,box-shadow .2s;outline:none;box-sizing:border-box}
.form-input:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.12)}
.form-label{display:inline-block;margin-bottom:6px;font-size:13.5px;font-weight:600;color:#344563;letter-spacing:.2px}
.content-card{background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,.06);margin-top:20px;overflow:hidden}
.content-card-header{display:flex;align-items:center;padding:16px 24px;font-size:15px;font-weight:600;color:#2c3e50;border-bottom:1px solid #edf0f5;position:relative}
.content-card-header::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:4px;background:linear-gradient(180deg,#667eea,#764ba2);border-radius:0 3px 3px 0}
.content-card-body{padding:20px 24px}
.new-table{width:100%;border-collapse:collapse;font-size:13.5px}
.new-table thead{background:#f4f6fa}
.new-table thead th{padding:12px 14px;text-align:left;font-weight:600;color:#5a6b87;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid #e4e8f0;white-space:nowrap}

.new-table tbody tr:nth-child(even):hover{background:#f8f9ff}
.new-table tbody td{padding:12px 14px;color:#42526e;vertical-align:middle}
.new-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;font-size:13px;font-weight:500;border:none;border-radius:50px;cursor:pointer;transition:all .2s;line-height:1.4;text-decoration:none;white-space:nowrap}
.new-btn.primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 3px 10px rgba(102,126,234,.3)}
.new-btn.primary:hover{box-shadow:0 5px 16px rgba(102,126,234,.4);transform:translateY(-1px)}

  .search-box{flex-direction:column;gap:8px}
  .search-box-input{border-radius:10px !important;border-right:1.5px solid #d5dae2 !important}

  .content-card-header{padding:12px 16px;font-size:14px;padding-left:22px}

  .new-table thead{display:none}
  .new-table tbody tr{display:block;margin-bottom:12px;background:#fff;border:1px solid #eef1f6;border-radius:12px;padding:10px 14px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
  .new-table tbody td{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #eef1f6;font-size:13px}
  .new-table tbody td:last-child{border-bottom:none}
  .new-table tbody td::before{content:attr(data-label);font-weight:600;color:#667eea;font-size:11.5px;text-transform:uppercase;margin-right:12px;white-space:nowrap;flex-shrink:0}
  .new-btn{padding:7px 14px;font-size:12px}
}
</style>
<script>
function add(){
layer.open({
        type: 1,
        area: ['520px', 'auto'],
        maxHeight: Math.min(window.innerHeight * 0.88, 640),
        closeBtn: 1,
        shift: 7,
        shadeClose: true,
        skin: 'layer-admin-form',
        title: "添加产品分类",
        content: ''
          + '<div class="card-body" style="width:480px;max-width:100%;padding:18px 20px 12px;box-sizing:border-box">'
          + '<div class="admin-form-tip"><strong>分类说明</strong>'
          + '分类用于前台产品分组展示。创建产品时需要选择分类。<br>'
          + '排序数值越大越靠前；隐藏后前台不显示该分类。</div>'
          + '<div class="mb-3"><label class="form-label">标题 <span style="color:#de350b">*</span></label>'
          + '<input class="form-control" type="text" name="name" value="" placeholder="例如：虚拟主机 / 云服务器">'
          + '<span class="admin-field-hint">分类名称，前台导航/列表显示</span></div>'
          + '<div class="mb-3"><label class="form-label">介绍</label>'
          + '<textarea style="height:120px" class="form-control" name="introduce" placeholder="可选，分类说明文案"></textarea>'
          + '<span class="admin-field-hint">可选描述</span></div>'
          + '<div class="row">'
          + '<div class="col-md-6 mb-3"><label class="form-label">排序</label>'
          + '<input class="form-control" type="text" name="sort" value="0" placeholder="数值越大越靠前">'
          + '<span class="admin-field-hint">越大越靠前</span></div>'
          + '<div class="col-md-6 mb-3"><label class="form-label">是否隐藏</label>'
          + '<select name="hide" class="form-select"><option value="0" selected>否</option><option value="1">是</option></select>'
          + '<span class="admin-field-hint">隐藏后前台不可见</span></div>'
          + '</div>'
          + '<div class="d-flex gap-2" style="padding-bottom:8px">'
          + '<button type="button" onclick="add1()" class="btn btn-primary">添加分类</button>'
          + '<button type="button" onclick="layer.closeAll()" class="btn btn-secondary">取消</button>'
          + '</div></div>',
  });

}

function add1(){
             var load = layer.msg('添加中，请稍后...', {icon:16, shade:0.8, time:false});
var name = $("input[name='name']").val();
var introduce = $("textarea[name='introduce']").val();
var sort = $("input[name='sort']").val();
var hide = $("select[name='hide']").val();

        $.ajax({
            type:'POST',
            url:'',
            data:{
                act:'add',
name:name,
introduce:introduce,
sort:sort,
hide:hide,
            },
            dataType:'json',
            timeout: 15000,
            success:function (data){
                layer.close(load)
                if(data.code == 1){
                    setTimeout(function (){
                        location.href = ''
                    },1000);
                    layer.alert(data.msg,{icon:1});
                }else{
                    GlassTip.error(data.msg);
                }
            }
        });
    }

function del(){
var id = [];
$("input[name='ids']:checked").each(function(i){
        id[i] =$(this).val();
      });
var id = id.join(",");
if(id==""){
layer.alert("未选择分类!",{icon:2,shade:0.8});
}else{
        layer.confirm('确定要删除ID为<span style="color:#0b5ed7">'+ id +'</span>的分类吗？', function (){
            del1(id)
        });
    }
}


    function del1(id){
        var load = layer.load('1',{time:false});

        $.ajax({
            type:'POST',
            url:'',
            data:{
                act:'delete',
                cid:id
            },
            dataType:'json',
            success:function (data){
                layer.close(load);
                if(data.code == 1){
layer.alert(data.msg,{icon:1},function(){
                        window.location.href = "";
                    });
                }else{
                    layer.alert(data.msg,{icon:2});
                }
            }
        });
    }

function qbdel(){
        layer.confirm('确定要删除<span style="color:#0b5ed7">全部</span>的分类吗？', function (){
            qbdel1()
        });
    }


    function qbdel1(){
        var load = layer.load('1',{time:false});

        $.ajax({
            type:'POST',
            url:'',
            data:{
                act:'qbdelete',
            },
            dataType:'json',
            success:function (data){
                layer.close(load);
                if(data.code == 1){
layer.alert(data.msg,{icon:1},function(){
                        window.location.href = "";
                    });
                }else{
                    layer.alert(data.msg,{icon:2});
                }
            }
        });
    }
</script>
