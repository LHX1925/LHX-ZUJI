<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据库配置 · LHX主机售卖系统 v1.3.4</title>
<link rel="stylesheet" type="text/css" href="__ROOT__/static/css/materialdesignicons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#eef2f7;color:#1f2937;padding:32px 16px}
.wrap{max-width:940px;margin:0 auto;background:#fff;border:1px solid #e4eaf2;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(16,42,87,.08),0 1px 3px rgba(16,42,87,.04);display:flex;min-height:530px}
.side{width:238px;flex:0 0 238px;background:linear-gradient(180deg,#f8fafd,#f1f5fb);border-right:1px solid #e8edf5;padding:22px 18px 16px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid #e6ecf5}
.logo{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:linear-gradient(135deg,#4b8ef7,#1552b8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 12px rgba(31,111,235,.28)}
.brand .nm{font-size:14px;font-weight:600;color:#16233a;line-height:1.3}
.brand .ver{display:inline-block;margin-top:4px;font-size:11px;color:#1552b8;background:#e9f1fd;border:1px solid #d2e2fb;padding:2px 8px;border-radius:20px}
.steps{list-style:none;margin-top:16px;flex:1}
.steps li{position:relative;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;margin-bottom:2px;border:1px solid transparent}
.steps li .d{width:24px;height:24px;flex:0 0 24px;border-radius:50%;background:#fff;border:1px solid #dde4ee;color:#9aa5b5;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;z-index:1}
.steps li .l{font-size:12.5px;color:#8b96a8}
.steps li:not(:last-child)::before{content:'';position:absolute;left:21px;top:33px;bottom:-3px;width:1px;background:#e2e9f3}
.steps li.ok .d{background:#e9f1fd;border-color:#c3d9fb;color:#1f6feb;font-size:13px}
.steps li.ok .l{color:#5b6a80}
.steps li.ok:not(:last-child)::before{background:#c3d9fb}
.steps li.on{background:#fff;border-color:#eaf0f8;box-shadow:0 2px 8px rgba(16,42,87,.07)}
.steps li.on .d{background:#1f6feb;border-color:#1f6feb;color:#fff;box-shadow:0 2px 8px rgba(31,111,235,.32)}
.steps li.on .l{color:#16233a;font-weight:600}
.cp{margin-top:14px;padding-top:13px;border-top:1px solid #e6ecf5;font-size:11px;color:#9aa5b5;line-height:1.75}
.cp span{display:block}
.cp b{color:#6b7789;font-weight:500}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{padding:18px 26px;border-bottom:1px solid #eef2f7;background:#fcfdfe;display:flex;align-items:flex-end}
.top h2{font-size:16px;font-weight:600;color:#16233a}
.top .sub{font-size:12px;color:#7c8798;margin-top:3px}
.top .pg{margin-left:auto;font-size:12px;color:#7c8798}
.bd{padding:20px 26px;flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:15px 16px}
.full{grid-column:1/-1}
.f label{display:block;font-size:12.5px;color:#54637a;font-weight:500;margin-bottom:6px}
.f label i{color:#e5484d;font-style:normal;margin-left:2px}
.inp{width:100%;height:38px;padding:0 12px;border:1px solid #dde4ee;border-radius:9px;background:#fff;font-size:13.5px;color:#16233a;font-family:inherit;outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:#4b8ef7;box-shadow:0 0 0 3px rgba(75,142,247,.15)}
.inp::placeholder{color:#aab4c2}
.pw{position:relative}
.pw .inp{padding-right:38px}
.pw .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:none;color:#a3adbd;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;border-radius:7px}
.pw .eye:hover{color:#1f6feb;background:#f2f7fe}
.hint{font-size:11.5px;color:#94a0b2;margin-top:6px;line-height:1.6}
.chk{display:flex;align-items:flex-start;gap:9px;margin-top:16px;padding:13px 15px;border:1px solid #e2ecfa;border-radius:11px;background:#f4f8fe;font-size:12.5px;color:#4a5a73;line-height:1.65;cursor:pointer}
.chk input{width:16px;height:16px;margin-top:1px;accent-color:#1f6feb;cursor:pointer}
.note{display:flex;gap:9px;margin-top:14px;padding:13px 15px;border-radius:11px;background:#f4f8fe;border:1px solid #e2ecfa;font-size:12.5px;color:#4a5a73;line-height:1.7}
.note i{font-size:16px;color:#1f6feb;flex:0 0 auto;margin-top:1px}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 20px;border-radius:9px;border:1px solid #2f74e0;background:linear-gradient(180deg,#3d84f5,#1f62d8);color:#fff;font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:none;box-shadow:0 4px 12px rgba(31,98,216,.24);font-family:inherit}
.btn:hover{filter:brightness(1.07);color:#fff}
.btn.gh{background:#fff;border-color:#d9e1ec;color:#54637a;box-shadow:none}
.btn.gh:hover{border-color:#a9c6f5;color:#1f6feb;background:#f7faff;filter:none}
.btn:disabled{background:#e8ecf3;border-color:#e2e8f0;color:#a6b0c0;box-shadow:none;cursor:not-allowed}
.act{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:16px 26px;border-top:1px solid #eef2f7;background:#fcfdfe}
.toast{position:fixed;top:22px;right:22px;z-index:99;max-width:340px;padding:12px 16px;border-radius:10px;font-size:13px;color:#fff;background:#1f6feb;box-shadow:0 10px 28px rgba(16,42,87,.22);transform:translateX(130%);transition:transform .25s}
.toast.on{transform:translateX(0)}
.toast.err{background:#e5484d}
@media(max-width:820px){
  body{padding:16px 10px}
  .wrap{flex-direction:column;min-height:0}
  .side{width:auto;flex:none;border-right:0;border-bottom:1px solid #e8edf5;padding:16px 14px 10px}
  .steps{display:flex;gap:2px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
  .steps li{flex:0 0 auto;margin-bottom:0;padding:7px 10px}
  .steps li:not(:last-child)::before{display:none}
  .bd{padding:18px 18px}
  .top{padding:16px 18px}
  .act{padding:14px 18px}
}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="brand">
      <span class="logo"><i class="mdi mdi-server-network"></i></span>
      <div>
        <div class="nm">LHX主机售卖系统</div>
        <span class="ver">v1.3.4</span>
      </div>
    </div>

    <ul class="steps">
      <li class="ok"><span class="d"><i class="mdi mdi-check"></i></span><span class="l">环境说明</span></li>
      <li class="ok"><span class="d"><i class="mdi mdi-check"></i></span><span class="l">许可协议</span></li>
      <li class="ok"><span class="d"><i class="mdi mdi-check"></i></span><span class="l">环境检测</span></li>
      <li class="on"><span class="d">4</span><span class="l">数据库配置</span></li>
      <li><span class="d">5</span><span class="l">管理员设置</span></li>
      <li><span class="d">6</span><span class="l">完成</span></li>
    </ul>

    <div class="cp">
      <span>虚拟主机售卖与管理系统</span>
      <span><b>MIT 开源协议</b> · © 2026 LHX</span>
      <span>QQ 交流群 <b>1127076433</b></span>
    </div>
  </aside>

  <div class="main">
    <div class="top">
      <div>
        <h2>数据库配置</h2>
        <div class="sub">填写 MySQL 连接信息，数据库不存在时会自动创建。</div>
      </div>
      <span class="pg">第 4 步 / 共 6 步</span>
    </div>

    <div class="bd">
      <form id="dbForm">
        <div class="g2">
          <div class="f"><label>数据库地址<i>*</i></label><input type="text" class="inp" name="hostname" value="127.0.0.1" required></div>
          <div class="f"><label>数据库端口<i>*</i></label><input type="text" class="inp" name="hostport" value="3306" required></div>
          <div class="f"><label>数据库用户名<i>*</i></label><input type="text" class="inp" name="username" placeholder="宝塔数据库页中的用户名" required></div>
          <div class="f"><label>数据库名<i>*</i></label><input type="text" class="inp" name="database" placeholder="宝塔数据库页中的库名" required></div>
          <div class="f full"><label>数据库密码</label>
            <div class="pw"><input type="password" class="inp" id="dbPassword" name="password" placeholder="留空表示无密码">
            <button type="button" class="eye" id="eyeBtn"><i class="mdi mdi-eye-outline"></i></button></div>
          </div>
          <div class="f full"><label>表前缀<i>*</i></label><input type="text" class="inp" name="prefix" value="dd_" required>
            <div class="hint">同一数据库部署多套系统时用不同前缀隔离，建议保持 dd_</div>
          </div>
        </div>

        <label class="chk" for="keepData">
          <input type="checkbox" id="keepData" name="keep_data" value="1">
          <span>保留现有数据：不清空库中已有的表与业务数据，下一步仍可重新设置管理员账号</span>
        </label>

        <input type="hidden" name="skip_db" id="skipDb" value="{if $skipDb}1{else}0{/if}">
      </form>

      <div class="note"><i class="mdi mdi-shield-key-outline"></i><span>数据库凭据仅用于本系统建表与连接，不会上传到任何第三方；安装完成后标记写入数据库专属表，不生成 install.lock 文件。</span></div>
    </div>

    <div class="act">
      <a class="btn gh" href="__ROOT__/install?step=step2"><i class="mdi mdi-arrow-left"></i> 上一步</a>
      <button type="submit" class="btn" id="submitBtn" form="dbForm">{if $skipDb}保存配置并继续{else/}测试连接并建表{/if} <i class="mdi mdi-arrow-right"></i></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function toast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (type === 'err' ? ' err' : '');
    setTimeout(function(){ t.classList.add('on'); }, 10);
    setTimeout(function(){ t.classList.remove('on'); }, 3000);
}
document.getElementById('eyeBtn').addEventListener('click', function() {
    var input = document.getElementById('dbPassword');
    var isPwd = input.type === 'password';
    input.type = isPwd ? 'text' : 'password';
    this.innerHTML = isPwd ? '<i class="mdi mdi-eye-off-outline"></i>' : '<i class="mdi mdi-eye-outline"></i>';
});
document.getElementById('dbForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var keep = document.getElementById('keepData').checked ? '1' : '0';
    var data = new FormData(this);
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    var old = btn.innerHTML;
    btn.innerHTML = '<i class="mdi mdi-loading mdi-spin"></i> 正在连接数据库...';

    fetch('', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded', 'X-Requested-With': 'XMLHttpRequest'},
        body: new URLSearchParams(data).toString()
    }).then(function(r){ return r.json(); }).then(function(res) {
        if (res.code == 1) {
            toast(res.msg || '配置成功');
            var target = (res.skip_admin == 1) ? '__ROOT__/install?step=done'
                       : '__ROOT__/install?step=step4' + (keep === '1' ? '&keep=1' : '');
            setTimeout(function(){ location.href = target; }, 1200);
        } else {
            toast('配置失败：' + (res.msg || '未知错误'), 'err');
            btn.disabled = false; btn.innerHTML = old;
        }
    }).catch(function(){
        toast('服务器错误，请稍后重试', 'err');
        btn.disabled = false; btn.innerHTML = old;
    });
});
</script>
</body>
</html>
