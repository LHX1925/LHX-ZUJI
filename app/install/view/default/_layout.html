<!DOCTYPE html>
<html lang="zh">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
<title>系统安装向导 · LHX-YunHost-Panel</title>
<link rel="stylesheet" type="text/css" href="__ROOT__/static/css/materialdesignicons.min.css">
<link rel="stylesheet" type="text/css" href="__ROOT__/static/css/animate.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;
  background:
    linear-gradient(135deg,rgba(99,102,241,0.15) 0%,rgba(168,85,247,0.15) 50%,rgba(236,72,153,0.15) 100%),
    url('__ROOT__/image_download_1787589357121.jpg') center/cover no-repeat fixed;
  background-attachment:fixed;
  color:#1e293b;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(at 20% 30%,rgba(255,255,255,0.4) 0%,transparent 40%),
             radial-gradient(at 80% 70%,rgba(199,210,254,0.3) 0%,transparent 40%);
}
.page-wrapper{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;padding:36px 16px 28px}

/* 顶部品牌 */
.brand{display:flex;align-items:center;justify-content:center;gap:14px;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,0.3);margin-bottom:24px}
.brand-logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#3b82f6,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;box-shadow:0 8px 24px rgba(59,130,246,0.45),inset 0 1px 0 rgba(255,255,255,0.3)}
.brand-text h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-0.02em}
.brand-text p{margin:2px 0 0;font-size:12px;opacity:0.9;font-weight:400}

/* 步骤条 */
.steps{display:flex;align-items:center;justify-content:center;max-width:720px;margin:0 auto 28px;flex-wrap:wrap;gap:4px}
.step{display:flex;align-items:center;color:#fff;position:relative}
.step-circle{
  width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.25);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:2px solid rgba(255,255,255,0.4);color:rgba(255,255,255,0.85);
  transition:all .3s;flex-shrink:0;
}
.step-label{
  margin-left:10px;font-size:13px;color:rgba(255,255,255,0.85);font-weight:500;
  white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,0.3);
}
.step-line{width:48px;height:2px;background:rgba(255,255,255,0.3);margin:0 6px;border-radius:2px}
.step.active .step-circle{background:#3b82f6;color:#fff;border-color:#fff;box-shadow:0 4px 14px rgba(59,130,246,0.6);transform:scale(1.08)}
.step.active .step-label{color:#fff;font-weight:700}
.step.done .step-circle{background:#10b981;color:#fff;border-color:rgba(255,255,255,0.5);box-shadow:0 4px 14px rgba(16,185,129,0.5)}
.step.done .step-line{background:rgba(16,185,129,0.6)}
.step.done .step-label{color:rgba(255,255,255,0.95)}

/* 卡片 */
.glass-card{
  max-width:720px;margin:0 auto;
  background:rgba(255,255,255,0.78);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,0.5);
  border-radius:24px;
  box-shadow:0 20px 60px rgba(15,23,42,0.18),inset 0 1px 0 rgba(255,255,255,0.6);
  padding:36px 40px;
  position:relative;overflow:hidden;
}
.glass-card::before{
  content:'';position:absolute;top:-50%;right:-30%;width:60%;height:200%;
  background:radial-gradient(circle,rgba(99,102,241,0.08) 0%,transparent 70%);
  pointer-events:none;
}
.card-title{
  font-size:20px;font-weight:700;color:#1e293b;margin-bottom:6px;
  display:flex;align-items:center;gap:10px;
}
.card-title i{color:#3b82f6}
.card-subtitle{color:#64748b;font-size:13px;margin-bottom:24px}

/* 按钮 */
.btn-primary-glass{
  width:100%;padding:14px 24px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#3b82f6 0%,#6366f1 100%);
  color:#fff;font-size:15px;font-weight:600;cursor:pointer;
  box-shadow:0 8px 20px rgba(59,130,246,0.4),inset 0 1px 0 rgba(255,255,255,0.2);
  transition:all .25s;letter-spacing:0.5px;
}
.btn-primary-glass:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 28px rgba(59,130,246,0.55),inset 0 1px 0 rgba(255,255,255,0.25)}
.btn-primary-glass:active{transform:translateY(0)}
.btn-primary-glass:disabled{background:linear-gradient(135deg,#cbd5e1,#94a3b8);cursor:not-allowed;box-shadow:none}

.btn-secondary-glass{
  padding:12px 20px;border:1px solid rgba(99,102,241,0.3);border-radius:12px;
  background:rgba(255,255,255,0.6);color:#3b82f6;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .2s;
}
.btn-secondary-glass:hover{background:rgba(255,255,255,0.9);border-color:#3b82f6}

/* 表单 */
.form-row{margin-bottom:18px}
.form-row label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:8px}
.form-row label .req{color:#ef4444;margin-left:2px}
.form-control-glass{
  width:100%;padding:13px 16px;
  background:rgba(255,255,255,0.65);
  border:1px solid rgba(203,213,225,0.7);
  border-radius:12px;font-size:14px;color:#1e293b;
  outline:none;transition:all .2s;
  font-family:inherit;
}
.form-control-glass:focus{
  background:rgba(255,255,255,0.95);
  border-color:#3b82f6;
  box-shadow:0 0 0 4px rgba(59,130,246,0.15);
}
.form-control-glass::placeholder{color:#94a3b8}
.form-help{font-size:12px;color:#64748b;margin-top:5px;line-height:1.6}
.form-help i{color:#3b82f6;margin-right:2px}

.form-check-glass{display:flex;align-items:center;gap:10px;margin:20px 0 24px;padding:14px 16px;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.18);border-radius:12px;cursor:pointer}
.form-check-glass input{width:18px;height:18px;accent-color:#3b82f6;cursor:pointer}
.form-check-glass label{margin:0;font-size:14px;color:#1e293b;font-weight:500;cursor:pointer}

/* 协议框 */
.license-box{
  background:rgba(248,250,252,0.7);border:1px solid rgba(203,213,225,0.5);
  border-radius:14px;padding:22px 24px;max-height:280px;overflow-y:auto;
  font-size:13px;line-height:1.85;color:#475569;margin-bottom:8px;
}
.license-box::-webkit-scrollbar{width:6px}
.license-box::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.license-box h5{font-size:15px;color:#1e293b;margin:0 0 10px;font-weight:700}
.license-box p{margin:6px 0}
.license-box ol{padding-left:22px;margin:6px 0}

/* 底部 */
.foot{text-align:center;color:rgba(255,255,255,0.85);font-size:12px;margin-top:auto;padding-top:24px;text-shadow:0 1px 4px rgba(0,0,0,0.3)}
.foot a{color:#fff;text-decoration:none;border-bottom:1px dashed rgba(255,255,255,0.6)}
.foot a:hover{border-bottom-color:#fff}

@media(max-width:768px){
  .page-wrapper{padding:24px 12px}
  .glass-card{padding:24px 18px;border-radius:20px}
  .step-label{display:none}
  .step-line{width:30px}
  .brand-text h1{font-size:18px}
  .brand-logo{width:44px;height:44px;font-size:22px}
}
</style>
</head>
<body>
<div class="page-wrapper">
  <div class="brand">
    <div class="brand-logo"><i class="mdi mdi-server-network"></i></div>
    <div class="brand-text">
      <h1>LHX-YunHost-Panel</h1>
      <p>虚拟主机销售管理系统 · 安装向导</p>
    </div>
  </div>

  <!-- 步骤条（由各页覆盖） -->
  {__CONTENT__}

  <div class="foot">
    Copyright © <a href="javascript:;">LHX-YunHost-Panel</a> · 基于 ThinkPHP 5 构建 · 建议在 <a href="javascript:;">Chrome / Edge / Safari</a> 中完成安装
  </div>
</div>
</body>
</html>
